# Количество рабочих процессов nginx (1 достаточно для простого прокси)
worker_processes 1;

events {
    # Максимальное число одновременных соединений на один рабочий процесс
    worker_connections 1024;
}

http {
    # Скрыть версию nginx из заголовка Server (базовый hardening)
    server_tokens off;

    # Группа upstream-серверов; имя "backend" используется в proxy_pass ниже.
    # "backend" — это имя сервиса из docker-compose.yml, Docker DNS резолвит его автоматически.
    upstream backend {
        server backend:8080;
    }

    server {
        # Слушать входящие HTTP-соединения на порту 80
        listen 80;

        # Принимать запросы с любым значением заголовка Host
        server_name _;

        location / {
            # Перенаправить все запросы на upstream-группу "backend"
            proxy_pass http://backend;

            # Передать оригинальный заголовок Host клиента бэкенду
            proxy_set_header Host              $host;

            # Передать реальный IP клиента
            proxy_set_header X-Real-IP         $remote_addr;

            # Добавить IP клиента в цепочку X-Forwarded-For (для проксирования через несколько уровней)
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Сообщить бэкенду, по какому протоколу пришёл запрос (http/https)
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
